<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Student - IT318 Final Exam</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <h1>🎓 Student Information System</h1>
        <div class="nav-links">
            <a href="/" class="nav-link">Home</a>
            <a href="/add" class="nav-link">Add Student</a>
        </div>
    </nav>

    <div class="container">
        <h2>Edit Student</h2>
        <form id="editForm" class="form-container">
            <input type="hidden" id="studentId" name="id">
            <div class="form-group">
                <label for="student_id">Student ID *</label>
                <input type="text" id="student_id" name="student_id" required maxlength="20">
            </div>
            <div class="form-group">
                <label for="full_name">Full Name *</label>
                <input type="text" id="full_name" name="full_name" required>
            </div>
            <div class="form-group">
                <label for="course">Course *</label>
                <input type="text" id="course" name="course" required>
            </div>
            <div class="form-group">
                <label for="year_level">Year Level *</label>
                <select id="year_level" name="year_level" required>
                    <option value="">Select Year</option>
                    <option value="1">1st Year</option>
                    <option value="2">2nd Year</option>
                    <option value="3">3rd Year</option>
                    <option value="4">4th Year</option>
                    <option value="5">5th Year</option>
                </select>
            </div>
            <div class="form-group">
                <label for="email">Email *</label>
                <input type="email" id="email" name="email" required>
            </div>
            <button type="submit" class="btn-submit">Update Student</button>
            <a href="/" class="btn-cancel">Cancel</a>
        </form>
    </div>

    <script>
        // Get student ID from URL
        const urlParams = new URLSearchParams(window.location.search);
        const studentId = urlParams.get('id');
        
        if (studentId) {
            loadStudent(studentId);
        }

        async function loadStudent(id) {
            try {
                const response = await fetch(`/api/students/${id}`);
                const student = await response.json();
                
                if (student.id) {
                    document.getElementById('studentId').value = student.id;
                    document.getElementById('student_id').value = student.student_id;
                    document.getElementById('full_name').value = student.full_name;
                    document.getElementById('course').value = student.course;
                    document.getElementById('year_level').value = student.year_level;
                    document.getElementById('email').value = student.email;
                }
            } catch (error) {
                console.error('Error loading student:', error);
                alert('Student not found');
                window.location.href = '/';
            }
        }

        document.getElementById('editForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const formData = new FormData(e.target);
            const data = Object.fromEntries(formData);
            
            try {
                const response = await fetch(`/api/students/${data.id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                
                const result = await response.json();
                
                if (response.ok) {
                    alert(result.message);
                    window.location.href = '/';
                } else {
                    alert('Error: ' + result.error);
                }
            } catch (error) {
                console.error('Error updating student:', error);
                alert('Failed to update student');
            }
        });
    </script>
</body>
</html>
