<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System - IT318 Final Exam</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <h1>🎓 Student Information System</h1>
        <div class="nav-links">
            <a href="/" class="nav-link active">Home</a>
            <a href="/add" class="nav-link">Add Student</a>
        </div>
    </nav>

    <div class="container">
        <h2>All Students</h2>
        <div id="students-container">
            <p>Loading students...</p>
        </div>
    </div>

    <script>
        // Load students on page load
        document.addEventListener('DOMContentLoaded', loadStudents);

        async function loadStudents() {
            try {
                const response = await fetch('/api/students');
                const students = await response.json();
                
                displayStudents(students);
            } catch (error) {
                console.error('Error loading students:', error);
                document.getElementById('students-container').innerHTML = 
                    '<p class="error">Failed to load students. Please try again.</p>';
            }
        }

        function displayStudents(students) {
            const container = document.getElementById('students-container');
            
            if (students.length === 0) {
                container.innerHTML = '<p>No students found. <a href="/add">Add the first student</a></p>';
                return;
            }

            container.innerHTML = `
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>Student ID</th>
                                <th>Full Name</th>
                                <th>Course</th>
                                <th>Year</th>
                                <th>Email</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${students.map(student => `
                                <tr>
                                    <td>${student.student_id}</td>
                                    <td>${student.full_name}</td>
                                    <td>${student.course}</td>
                                    <td>${student.year_level}</td>
                                    <td>${student.email}</td>
                                    <td>
                                        <a href="/edit/${student.id}" class="btn-edit">Edit</a>
                                        <button onclick="deleteStudent(${student.id})" class="btn-delete">Delete</button>
                                    </td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
            `;
        }

        async function deleteStudent(id) {
            if (!confirm('Are you sure you want to delete this student?')) return;
            
            try {
                const response = await fetch(`/api/students/${id}`, {
                    method: 'DELETE'
                });
                
                if (response.ok) {
                    loadStudents(); // Reload the list
                } else {
                    alert('Failed to delete student');
                }
            } catch (error) {
                console.error('Error deleting student:', error);
                alert('Failed to delete student');
            }
        }
    </script>
</body>
</html>
